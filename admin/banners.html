<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){var t=localStorage.getItem('aravali-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Banners - Aravali Store Admin</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <img src="../assets/logo.svg" alt="Aravali Store">
        <h3>Admin Panel</h3>
        <p class="admin-info">admin</p>
      </div>
      <ul class="admin-nav">
        <li><a href="/admin" data-page="dashboard"><span class="nav-icon">📊</span> Dashboard</a></li>
        <li><a href="/admin/products" data-page="products"><span class="nav-icon">📦</span> Products</a></li>
        <li><a href="/admin/catalogs" data-page="catalogs"><span class="nav-icon">📂</span> Catalogs</a></li>
        <li><a href="/admin/banners" data-page="banners"><span class="nav-icon">🖼️</span> Banners</a></li>
        <li><a href="/admin/offers" data-page="offers"><span class="nav-icon">🏷️</span> Offers</a></li>
        <li><a href="/admin/orders" data-page="orders"><span class="nav-icon">🛒</span> Orders</a></li>
        <li><a href="/admin/returns" data-page="returns"><span class="nav-icon">🔄</span> Returns</a></li>
        <li><a href="/admin/users" data-page="users"><span class="nav-icon">👥</span> Users</a></li>
        <li><a href="/admin/stock-logs" data-page="stock-logs"><span class="nav-icon">📋</span> Stock Logs</a></li>
        <li><a href="/admin/admins" data-page="admins"><span class="nav-icon">🔑</span> Admins</a></li>
        <li><a href="/admin/settings" data-page="settings"><span class="nav-icon">⚙️</span> Settings</a></li>
        <li style="margin-top:20px;"><a href="/"><span class="nav-icon">🏪</span> View Store</a></li>
        <li><a href="#" onclick="App.logout()" style="color:rgba(255,100,100,0.85);"><span class="nav-icon">🚪</span> Logout</a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Banners</h1>
      </div>
      <div class="admin-content"></div>
    </main>
  </div>

  <button class="admin-sidebar-toggle" onclick="Admin.toggleSidebar()">☰</button>

  <div id="productModal" class="modal-overlay" onclick="if(event.target===this){this.classList.remove('active');document.body.classList.remove('modal-open');}">
    <div class="modal" id="productModalContent"></div>
  </div>

  <script src="../DBMS/data.js"></script>
  <script src="../DBMS/database.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
